<!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#10b981',
              emeraldDeep: '#059669',

              dark: '#0a0d0c',
              card: 'rgba(18, 23, 21, 0.75)'
            }
          },

            display: ['Space Grotesk', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }

<!-- Core Theme & Visual Effects Styles -->
<style data-purpose="custom-glass-effects">
    .glass-panel {
      background: linear-gradient(135deg, rgba(25, 33, 30, 0.7) 0%, rgba(12, 16, 15, 0.85) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.15);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }
    
    .glass-button {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-button:active {
      transform: scale(0.97);
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(52, 211, 153, 0.3);
    }

    .scanner-corner {
      width: 18px;
      height: 18px;
      border-color: #10b981;
      position: absolute;
      pointer-events: none;
    }
  </style>
<!-- Animations & Refinements -->
<style data-purpose="animations">
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    .glow-pulse {
      animation: subtlePulse 4s ease-in-out infinite;
    }
    @keyframes floatMochi {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .mochi-float {
      animation: floatMochi 3.2s ease-in-out infinite;
    }
    .pixelated-render {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="min-h-screen text-neutral-100 font-sans antialiased flex flex-col justify-between selection:bg-brand-emerald selection:text-black relative overflow-x-hidden p-4 sm:p-6">

<div aria-hidden="true" class="fixed top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-brand-emeraldDeep/20 rounded-full blur-[100px] pointer-events-none glow-pulse"></div>
<div aria-hidden="true" class="fixed bottom-0 right-0 w-80 h-80 bg-teal-900/15 rounded-full blur-[90px] pointer-events-none"></div>
<!-- Safe Area Wrapper for iOS Stand Screen -->

<!-- Focal Area: QR Code with Mochi Peeking -->

<!-- Minimal Discreet Footer -->
<footer class="text-center pb-6 pt-2"><p class="text-[10px] text-neutral-500 tracking-[0.3em] uppercase">Experiencia Gastronómica</p></footer></div>
<!-- Notification Toast for Waiter Call -->

<!-- Micro Interaction Handler -->
<script data-purpose="interactive-actions">
    document.addEventListener('DOMContentLoaded', () => {
      const waiterBtn = document.getElementById('btn-call-waiter');
      const toast = document.getElementById('waiter-toast');
      let timeoutId = null;

      waiterBtn?.addEventListener('click', () => {
        if (timeoutId) clearTimeout(timeoutId);
        
        // Show feedback toast
        toast.classList.remove('translate-y-24', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');

        // Reset after 3 seconds
        timeoutId = setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-24', 'opacity-0');
        }, 3200);
      });
    });
  </script>


</body></html>
